# TensorFleet Drone JS Configuration
# Connection details (vm_ip/rosbridge_url) are typically filled automatically from
# .env + .tensorfleet metadata; override here only if you need manual settings.

network:
  vm_ip: ""              # Populated automatically when the VM is running
  rosbridge_url: ""      # rosbridge websocket URL (auto-filled via .env)
  rosbridge_port: 9091
  namespace: "/drone"
  setpoint_frame: "map"

simulation:
  world: "empty"  # Options: empty, warehouse, outdoor
  headless: false
  enable_gui: true

sensors:
  camera:
    enabled: true
    resolution: [640, 480]
    fps: 30

  lidar:
    enabled: false
    range: 10.0

  gps:
    enabled: true
    update_rate: 10  # Hz

flight:
  max_altitude: 100.0  # meters
  max_speed: 10.0      # m/s
  waypoint_hold_ms: 5000
  waypoints:
    - [0.0, 0.0, 5.0]
    - [10.0, 0.0, 5.0]
    - [10.0, 10.0, 5.0]
    - [0.0, 10.0, 5.0]
    - [0.0, 0.0, 5.0]
    - [0.0, 0.0, 0.0]

offboard:
  alt_target: 2.0
  edge_m: 10.0
  waypoint_radius: 2.0
  slow_radius: 10.0
  v_fast: 20.0
  v_min: 1.0
  setpoint_hz: 20.0
  arm_wait: 3.0
  takeoff_timeout: 60.0
  land_timeout: 300.0

ai_models:
  object_detection:
    model: "yolov8n"
    confidence_threshold: 0.5

vision:
  topics:
    image_topic: "/drone_camera/image_raw"
    annotated_image_topic: "/drone_camera/image_annotated"
    landing_image_topic: "/drone_camera/down/image_raw"
    landing_annotated_image_topic: "/drone_camera/down/image_annotated"
    message_type: "sensor_msgs/Image"

  yolo:
    model_name: "yolov8n"
    model_path: ""
    confidence_threshold: 0.25
    iou_threshold: 0.45
    input_size: 640
    target_label: "dining table"

  landing_demo:
    takeoff_altitude_m: 4.0
    xy_gain: 1.3
    max_xy_speed: 1.0
    descent_speed_mps: 0.45
    slow_descent_speed_mps: 0.18
    centered_tolerance: 0.10
    descent_tolerance: 0.18
    min_blob_pixels: 150
    handoff_area_ratio: 0.16
    stable_frames_required: 12
    loop_hz: 10
    pad_color: "magenta"
    frame_timeout_ms: 1500

logging:
  level: "info"
  save_to_file: true
  directory: "./logs"
